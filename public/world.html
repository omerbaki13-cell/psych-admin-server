<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Konser Alanı 3D - Güneş Tutulması</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; font-family:sans-serif; height:100%; width:100%; user-select:none; -webkit-user-select:none; }
  #hint { position:fixed; bottom:16px; left:16px; color:#fff; font-size:12px; background:rgba(0,0,0,0.7); padding:8px 12px; border-radius:8px; z-index:10; pointer-events:none; }
  #actionPrompt { position:fixed; top:28%; left:50%; transform:translate(-50%, -50%); color:#fff; font-size:16px; font-weight:bold; background:rgba(0,0,0,0.85); padding:12px 24px; border-radius:30px; border:2px solid #ff2f82; display:none; z-index:20; text-align:center; cursor:pointer; }
  canvas { display:block; width:100vw; height:100vh; position:absolute; top:0; left:0; z-index:1; }
  
  #timeBar { position:fixed; top:15px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:30; background:rgba(0,0,0,0.7); padding:6px 10px; border-radius:25px; border:1px solid rgba(255,255,255,0.2); max-width:95vw; overflow-x:auto; }
  .time-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:11px; font-weight:bold; padding:6px 10px; border-radius:18px; cursor:pointer; touch-action:manipulation; transition:0.2s; white-space:nowrap; }
  .time-btn:active, .time-btn.active { background:#ff2f82; border-color:#fff; transform:scale(1.05); }

  #leftMoveZone { position:fixed; top:0; left:0; width:45%; height:100%; z-index:15; touch-action:none; display:none; }
  #rightLookZone { position:fixed; top:0; right:0; width:55%; height:100%; z-index:5; touch-action:none; display:none; }
  
  #joystick { position:fixed; bottom:30px; left:30px; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,0.2); pointer-events:none; z-index:10; display:none; }
  #joystickKnob { position:absolute; top:35px; left:35px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.6); }

  .mobile-btn { position:fixed; width:65px; height:65px; border-radius:50%; background:rgba(0,0,0,0.65); border:2px solid rgba(255,255,255,0.4); color:#fff; font-size:13px; font-weight:bold; display:none; align-items:center; justify-content:center; text-align:center; z-index:20; touch-action:manipulation; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
  .mobile-btn:active { background:rgba(255,47,130,0.8); border-color:#fff; transform:scale(0.95); }
  
  #jumpBtn { right:30px; bottom:30px; width:75px; height:75px; font-size:14px; background:rgba(255,47,130,0.4); border-color:#ff2f82; }
  #turnBackBtn { right:30px; bottom:120px; font-size:11px; }

  #rotateMsg { position:fixed; inset:0; background:#000; color:#fff; display:none; align-items:center; justify-content:center; text-align:center; font-size:18px; z-index:100; padding:20px; box-sizing:border-box; }
  @media (orientation: portrait) {
    #rotateMsg { display:flex; }
  }

  #adminBtn { position:fixed; top:14px; right:14px; z-index:50; width:40px; height:40px; border-radius:50%; background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #adminOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
  #adminOverlay.show { display:flex; }
  .admin-box { background:#1e1e2f; color:#eee; border-radius:12px; padding:20px; width:100%; max-width:340px; font-family:sans-serif; box-sizing:border-box; }
  .admin-box h2 { margin:0 0 14px; color:#ff5fa2; font-size:18px; }
  .admin-box input, .admin-box textarea { width:100%; box-sizing:border-box; padding:9px; border-radius:6px; border:none; margin-top:8px; font-size:14px; font-family:sans-serif; }
  .admin-box textarea { resize:vertical; }
  .admin-box button { margin-top:12px; padding:9px 16px; border:none; border-radius:6px; background:#ff5fa2; color:#fff; font-weight:bold; cursor:pointer; width:100%; }
  .admin-box button:hover { background:#ff3d91; }
  .admin-box .closeBtn { background:transparent; color:#aaa; font-weight:normal; margin-top:8px; }
  .admin-box .closeBtn:hover { background:rgba(255,255,255,0.08); }
  #adminMsgStatus, #loginErr { margin-top:8px; font-size:13px; min-height:16px; }

  #announceBanner { position:fixed; top:15px; left:50%; transform:translate(-50%,-140%); background:rgba(255,47,130,0.92); color:#fff; padding:10px 20px; border-radius:10px; font-weight:bold; font-size:14px; z-index:60; max-width:90vw; text-align:center; transition:transform 0.4s ease; box-shadow:0 4px 14px rgba(0,0,0,0.5); }
  #announceBanner.show { transform:translate(-50%,0); }
  .hidden { display:none; }

  #playerLoginOverlay { position:fixed; inset:0; background:#0b0b14; z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
  .player-login-box { background:#1e1e2f; color:#eee; border-radius:12px; padding:24px; width:100%; max-width:320px; font-family:sans-serif; box-sizing:border-box; text-align:center; }
  .player-login-box h1 { color:#ff5fa2; font-size:20px; margin:0 0 16px; }
  .player-login-box input { width:100%; box-sizing:border-box; padding:10px; border-radius:6px; border:none; margin-top:10px; font-size:14px; }
  .player-login-box button { margin-top:12px; padding:10px 16px; border:none; border-radius:6px; background:#ff5fa2; color:#fff; font-weight:bold; cursor:pointer; width:100%; }
  .player-login-box button:hover { background:#ff3d91; }
  .player-login-box .secondary { background:transparent; border:1px solid #ff5fa2; }
  .player-login-box .secondary:hover { background:rgba(255,95,162,0.15); }
  #playerLoginStatus { margin-top:10px; font-size:13px; min-height:16px; color:#f88; }
</style>
</head>
<body>

<div id="playerLoginOverlay">
  <div class="player-login-box">
    <h1>🎧 Konser Alanına Giriş</h1>
    <input type="text" id="playerUser" placeholder="Kullanıcı adı" autocomplete="off">
    <input type="password" id="playerPass" placeholder="Şifre">
    <button onclick="playerLogin()">Giriş Yap</button>
    <button class="secondary" onclick="playerRegister()">Kayıt Ol</button>
    <div id="playerLoginStatus"></div>
  </div>
</div>

<div id="rotateMsg">📱↻ Daha iyi bir deneyim için telefonu yatay çevir</div>
<div id="hint">Masaüstü: WASD yürü, Space Zıpla, [E] Otur | Mobil: Sol Yürü, Sağ Bakış</div>
<div id="actionPrompt">Oturmak için [E] tuşuna bas / Dokun</div>

<div id="timeBar">
  <button class="time-btn" id="btn-sunrise">🌅 Gün Doğumu</button>
  <button class="time-btn" id="btn-noon">☀️ Öğlen</button>
  <button class="time-btn" id="btn-afternoon">🌆 İkindi</button>
  <button class="time-btn" id="btn-sunset">🌇 Akşam</button>
  <button class="time-btn" id="btn-night">🌙 Gece</button>
  <button class="time-btn active" id="btn-eclipse">🌒 Güneş Tutulması</button>
</div>

<div id="leftMoveZone"></div>
<div id="rightLookZone"></div>

<div id="joystick">
  <div id="joystickKnob"></div>
</div>

<button id="jumpBtn" class="mobile-btn">ZIPLA<br>🦘</button>
<button id="turnBackBtn" class="mobile-btn">ARKANI<br>DÖN 🔄</button>

<div id="announceBanner"></div>
<audio id="bgAudio" preload="auto"></audio>

<button id="adminBtn" title="Admin Girişi">🔒</button>

<div id="adminOverlay">
  <div class="admin-box" id="loginPanel">
    <h2>🔒 Admin Giriş</h2>
    <input type="text" id="adminUser" placeholder="Kullanıcı adı" autocomplete="off">
    <input type="password" id="adminPass" placeholder="Şifre">
    <button onclick="adminTryLogin()">Giriş Yap</button>
    <button class="closeBtn" onclick="closeAdminOverlay()">Kapat</button>
    <div id="loginErr" style="color:#f88;"></div>
  </div>

  <div class="admin-box hidden" id="adminPanel">
    <h2>📢 Duyuru Gönder</h2>
    <textarea id="adminMsgInput" rows="3" placeholder="Tüm oyunculara gösterilecek mesaj..."></textarea>
    <button onclick="adminSendAnnouncement()">Gönder</button>
    <button class="closeBtn" onclick="closeAdminOverlay()">Kapat</button>
    <div id="adminMsgStatus"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function isTouchDevice(){ return ('ontouchstart' in window) || navigator.maxTouchPoints > 0; }

function startWorld() {
  if (typeof THREE === 'undefined') {
    alert("Three.js yüklenemedi. İnternet bağlantınızı kontrol edin.");
    return;
  }

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const defaultEyeHeight = 1.7;
  camera.position.set(0, defaultEyeHeight, 28);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // --- DİNAMİK GÖKYÜZÜ KUBBESİ ---
  const skyCanvas = document.createElement('canvas');
  skyCanvas.width = 512;
  skyCanvas.height = 512;
  const skyCtx = skyCanvas.getContext('2d');
  const skyTexture = new THREE.CanvasTexture(skyCanvas);

  const skyGeo = new THREE.SphereGeometry(300, 32, 15);
  const skyMat = new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide });
  const skyDome = new THREE.Mesh(skyGeo, skyMat);
  scene.add(skyDome);

  function updateSkyGradient(leftColor, rightColor) {
    const grad = skyCtx.createLinearGradient(0, 0, skyCanvas.width, 0);
    grad.addColorStop(0, leftColor);
    grad.addColorStop(0.5, leftColor);
    grad.addColorStop(0.51, rightColor);
    grad.addColorStop(1, rightColor);

    skyCtx.fillStyle = grad;
    skyCtx.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
    skyTexture.needsUpdate = true;
  }

  // --- TABAN VE SAHNE ---
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(120, 120),
    new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.9 })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  const stageHeight = 1.5;
  const stageBounds = { minX: -12, maxX: 12, minZ: -26, maxZ: -14 };
  const stage = new THREE.Mesh(
    new THREE.BoxGeometry(24, stageHeight, 12),
    new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.5 })
  );
  stage.position.set(0, stageHeight / 2, -20);
  scene.add(stage);

  const screenMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 9),
    new THREE.MeshStandardMaterial({ color: 0xff3385, emissive: 0xff1066, emissiveIntensity: 0.8 })
  );
  screenMesh.position.set(0, 6.5, -25.9);
  scene.add(screenMesh);

  // --- HOPARLÖRLER ---
  const boxMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0d, roughness: 0.3 });
  const coneMat = new THREE.MeshStandardMaterial({ color: 0x22222a, roughness: 0.2, metalness: 0.8 });

  function createSpeakerTower(xPos) {
    const group = new THREE.Group();
    const towerBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 9, 2), boxMat);
    towerBody.position.set(0, 6, 0);
    group.add(towerBody);

    for (let y = 2.2; y <= 9.8; y += 1.8) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.3, 16), coneMat);
      cone.rotation.x = -Math.PI / 2;
      cone.position.set(0, y, 1.05);
      group.add(cone);
    }
    group.position.set(xPos, 0, -25);
    scene.add(group);
  }
  createSpeakerTower(-11.8);
  createSpeakerTower(11.8);

  function createTopSpeakers() {
    const group = new THREE.Group();
    for(let x = -9; x <= 9; x += 3) {
      const spk = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.2, 1.5), boxMat);
      spk.position.set(x, 0, 0);
      group.add(spk);

      const cone1 = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.2, 16), coneMat);
      cone1.rotation.x = -Math.PI / 2;
      cone1.position.set(x - 0.6, 0, 0.76);
      group.add(cone1);

      const cone2 = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.2, 16), coneMat);
      cone2.rotation.x = -Math.PI / 2;
      cone2.position.set(x + 0.6, 0, 0.76);
      group.add(cone2);
    }
    group.position.set(0, 11.8, -25.4);
    scene.add(group);
  }
  createTopSpeakers();

  // --- IŞIK KULELERİ VE PROJEKTÖRLER ---
  const spotLights = [];

  function createLightTower(x, z, colorHex, targetVec) {
    const group = new THREE.Group();
    
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 6), new THREE.MeshStandardMaterial({ color: 0x333344 }));
    pole.position.y = 3;
    group.add(pole);

    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshBasicMaterial({ color: colorHex }));
    lamp.position.y = 6;
    group.add(lamp);

    const spotLight = new THREE.SpotLight(colorHex, 3, 45, Math.PI / 5, 0.4, 1);
    spotLight.position.set(x, 6, z);
    if(targetVec) {
      spotLight.target.position.copy(targetVec);
      scene.add(spotLight.target);
    }
    scene.add(spotLight);
    spotLights.push(spotLight);

    group.position.set(x, 0, z);
    scene.add(group);
  }

  createLightTower(-3, 25, 0x00ffff, new THREE.Vector3(-3, 0, 10));
  createLightTower(3, 25, 0x00ffff, new THREE.Vector3(3, 0, 10));
  createLightTower(-8, -15, 0xff0077, new THREE.Vector3(0, 0, -20));
  createLightTower(8, -15, 0x33ff00, new THREE.Vector3(0, 0, -20));
  // --- GÜNEŞ VE AY ELEMANLARI ---
  const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(4.5, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
  );
  sunMesh.position.set(0, 22, -60);
  scene.add(sunMesh);

  const moonMesh = new THREE.Mesh(
    new THREE.SphereGeometry(4.3, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x05050a })
  );
  moonMesh.position.set(1.8, 22.5, -59.5);
  scene.add(moonMesh);

  const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
  scene.add(ambientLight);

  // --- MOD GEÇİŞLERİ ---
  function applyTimeOfDay(type) {
    if (type === 'eclipse') {
      updateSkyGradient("#3877cc", "#050a18");
      ambientLight.color.setHex(0x99aacc);
      ambientLight.intensity = 1.4;
      sunMesh.visible = true;
      moonMesh.visible = true;
      sunMesh.position.set(0, 22, -60);
      sunMesh.material.color.setHex(0xffaa00);
      moonMesh.position.set(1.8, 22.5, -59.5);
    } else if (type === 'sunrise') {
      updateSkyGradient("#d47a45", "#d47a45");
      ambientLight.color.setHex(0xffaa77);
      ambientLight.intensity = 2.0;
      sunMesh.visible = true;
      moonMesh.visible = false;
      sunMesh.position.set(-28, 8, -60);
      sunMesh.material.color.setHex(0xffaa44);
    } else if (type === 'noon') {
      updateSkyGradient("#4499ff", "#4499ff");
      ambientLight.color.setHex(0xffffff);
      ambientLight.intensity = 3.0;
      sunMesh.visible = true;
      moonMesh.visible = false;
      sunMesh.position.set(0, 30, -60);
      sunMesh.material.color.setHex(0xffffff);
    } else if (type === 'afternoon') {
      updateSkyGradient("#3a6098", "#3a6098");
      ambientLight.color.setHex(0xffddaa);
      ambientLight.intensity = 2.2;
      sunMesh.visible = true;
      moonMesh.visible = false;
      sunMesh.position.set(15, 20, -60);
      sunMesh.material.color.setHex(0xffcc66);
    } else if (type === 'sunset') {
      updateSkyGradient("#5a2040", "#5a2040");
      ambientLight.color.setHex(0xff5566);
      ambientLight.intensity = 1.5;
      sunMesh.visible = true;
      moonMesh.visible = false;
      sunMesh.position.set(28, 6, -60);
      sunMesh.material.color.setHex(0xff3300);
    } else if (type === 'night') {
      updateSkyGradient("#050a18", "#050a18");
      ambientLight.color.setHex(0x555588);
      ambientLight.intensity = 1.0;
      sunMesh.visible = false;
      moonMesh.visible = true;
      moonMesh.position.set(0, 22, -60);
      moonMesh.material.color.setHex(0xddddff);
    }
  }

  applyTimeOfDay('eclipse');

  const timeBtns = {
    'btn-sunrise': 'sunrise',
    'btn-noon': 'noon',
    'btn-afternoon': 'afternoon',
    'btn-sunset': 'sunset',
    'btn-night': 'night',
    'btn-eclipse': 'eclipse'
  };

  Object.keys(timeBtns).forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        applyTimeOfDay(timeBtns[id]);
      });
    }
  });

  // --- GÖRSELE UYGUN ERGONOMİK TİYATRO / KONSER KOLTUĞU ---
  const seatPositions = [];

  function createSingleChairMesh() {
    const chairGroup = new THREE.Group();

    // Materyaller (Bordo kumaş, Ahşap kabuk, Siyah metal ayak)
    const fabricMat = new THREE.MeshStandardMaterial({ color: 0x4a0e2e, roughness: 0.8 }); // Bordo / Mürdüm Kumaş
    const woodMat = new THREE.MeshStandardMaterial({ color: 0xc86a28, roughness: 0.4 });   // Ahşap Kaplama
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8, roughness: 0.3 }); // Siyah Metal

    // 1. Ayak ve Taban (Merkezi Silindir Ayak)
    const basePedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.15, 16), metalMat);
    basePedestal.position.set(0, 0.075, 0);
    chairGroup.add(basePedestal);

    const centerColumn = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.35, 16), metalMat);
    centerColumn.position.set(0, 0.3, 0);
    chairGroup.add(centerColumn);

    // 2. Oturma Minderi (Kalın Ergonomik Kumaş)
    const seatCushion = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.25, 0.85), fabricMat);
    seatCushion.position.set(0, 0.55, 0.05);
    chairGroup.add(seatCushion);

    // 3. Sırtlık (Bordo Minder + Arka Ahşap Kabuk)
    const backCushion = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.95, 0.18), fabricMat);
    backCushion.position.set(0, 1.05, 0.42);
    chairGroup.add(backCushion);

    // Sırtın arkasındaki Ahşap Panel
    const backWoodShell = new THREE.Mesh(new THREE.BoxGeometry(0.92, 1.0, 0.06), woodMat);
    backWoodShell.position.set(0, 1.05, 0.52);
    chairGroup.add(backWoodShell);

    // 4. Yan Paneller ve Kolçaklar (Ahşap Üstlü Kapalı Yan Paneller)
    function createSidePanel(xPos) {
      const panelGroup = new THREE.Group();
      
      // Ahşap Yan Dış Gövde
      const sideBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.65, 0.85), woodMat);
      sideBody.position.set(0, 0.6, 0.05);
      panelGroup.add(sideBody);

      // Yan Panel İç Bordo Kumaş Detayı
      const sideFabric = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.5, 0.7), fabricMat);
      sideFabric.position.set(xPos > 0 ? -0.04 : 0.04, 0.6, 0.05);
      panelGroup.add(sideFabric);

      // Üst Ahşap Kolçak Çıtası
      const armRest = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.06, 0.9), woodMat);
      armRest.position.set(0, 0.94, 0.05);
      panelGroup.add(armRest);

      panelGroup.position.set(xPos, 0, 0);
      return panelGroup;
    }

    chairGroup.add(createSidePanel(-0.48)); // Sol Panel
    chairGroup.add(createSidePanel(0.48));  // Sağ Panel

    return chairGroup;
  }

  const baseChair = createSingleChairMesh();
  
  // 1-2 ve 3-4 (çiftli grup) düzeni
  const xOffsets = [-15, -13.6,  -9, -7.6,  -3, -1.6,   1.6, 3,   7.6, 9,   13.6, 15];

  for (let z = -6; z <= 22; z += 2.4) {
    xOffsets.forEach(x => {
      const chair = baseChair.clone();
      chair.position.set(x, 0, z);
      scene.add(chair);
      seatPositions.push({ x: x, y: 0.55, z: z });
    });
  }

  // --- HAREKET VE KONTROLLER ---
  let yaw = 0, pitch = 0;
  let moveF = false, moveB = false, moveL = false, moveR = false;
  let locked = false;
  let isSeated = false;
  let nearestSeat = null;

  let velocityY = 0;
  const gravity = -0.012;
  const jumpStrength = 0.22;
  let isGrounded = true;
  let currentBaseY = defaultEyeHeight;

  const actionPrompt = document.getElementById("actionPrompt");

  function triggerJump() {
    if (isGrounded && !isSeated) {
      velocityY = jumpStrength;
      isGrounded = false;
    }
  }

  function turnBack() { yaw += Math.PI; }

  const isTouch = isTouchDevice();

  if (!isTouch) {
    renderer.domElement.addEventListener("click", () => {
      if (!isSeated) renderer.domElement.requestPointerLock();
    });
    document.addEventListener("pointerlockchange", () => {
      locked = document.pointerLockElement === renderer.domElement;
    });
    document.addEventListener("mousemove", (e) => {
      if (!locked && !isSeated) return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.0025;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
    });
    document.addEventListener("keydown", (e) => {
      if (e.code === "KeyW") moveF = true;
      if (e.code === "KeyS") moveB = true;
      if (e.code === "KeyA") moveL = true;
      if (e.code === "KeyD") moveR = true;
      if (e.code === "Space") {
        if (isSeated) standUp();
        else triggerJump();
      }
      if (e.code === "KeyE") toggleSeat();
    });
    document.addEventListener("keyup", (e) => {
      if (e.code === "KeyW") moveF = false;
      if (e.code === "KeyS") moveB = false;
      if (e.code === "KeyA") moveL = false;
      if (e.code === "KeyD") moveR = false;
    });
  }

  function toggleSeat() {
    if (isSeated) {
      standUp();
    } else if (nearestSeat) {
      isSeated = true;
      yaw = 0;
      pitch = 0;
      camera.position.set(nearestSeat.x, nearestSeat.y + 0.75, nearestSeat.z);
      actionPrompt.innerText = "Kalkmak için [E] veya Dokun";
    }
  }

  function standUp() {
    if (!isSeated) return;
    isSeated = false;
    camera.position.y = currentBaseY;
    camera.position.z += 0.8;
    actionPrompt.style.display = "none";
  }

  let joyDX = 0, joyDY = 0;

  if (isTouch) {
    const leftMoveZone = document.getElementById("leftMoveZone");
    const rightLookZone = document.getElementById("rightLookZone");
    const joystick = document.getElementById("joystick");
    const joystickKnob = document.getElementById("joystickKnob");
    const jumpBtn = document.getElementById("jumpBtn");
    const turnBackBtn = document.getElementById("turnBackBtn");

    leftMoveZone.style.display = "block";
    rightLookZone.style.display = "block";
    joystick.style.display = "block";
    jumpBtn.style.display = "flex";
    turnBackBtn.style.display = "flex";

    jumpBtn.addEventListener("touchstart", (e) => { e.stopPropagation(); triggerJump(); }, { passive: true });
    turnBackBtn.addEventListener("touchstart", (e) => { e.stopPropagation(); turnBack(); }, { passive: true });

    let joyActive = false, joyTouchId = null, joyStartX = 0, joyStartY = 0;

    leftMoveZone.addEventListener("touchstart", (e) => {
      if (joyActive) return;
      const t = e.changedTouches[0];
      joyTouchId = t.identifier;
      joyActive = true;
      joyStartX = t.clientX;
      joyStartY = t.clientY;

      joystick.style.left = (joyStartX - 55) + "px";
      joystick.style.top = (joyStartY - 55) + "px";
      joystickKnob.style.left = "35px";
      joystickKnob.style.top = "35px";
    }, { passive: true });

    leftMoveZone.addEventListener("touchmove", (e) => {
      if (!joyActive) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === joyTouchId) {
          const dx = t.clientX - joyStartX;
          const dy = t.clientY - joyStartY;
          const maxDist = 40;
          const dist = Math.min(maxDist, Math.hypot(dx, dy));
          const angle = Math.atan2(dy, dx);
          const kx = Math.cos(angle) * dist;
          const ky = Math.sin(angle) * dist;

          joystickKnob.style.left = (35 + kx) + "px";
          joystickKnob.style.top = (35 + ky) + "px";

          joyDX = kx / maxDist;
          joyDY = ky / maxDist;
          break;
        }
      }
    }, { passive: true });

    function resetJoystick(e) {
      if (!joyActive) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          joyActive = false;
          joyTouchId = null;
          joyDX = 0;
          joyDY = 0;
          joystick.style.left = "30px";
          joystick.style.top = "";
          joystick.style.bottom = "30px";
          joystickKnob.style.left = "35px";
          joystickKnob.style.top = "35px";
          break;
        }
      }
    }

    leftMoveZone.addEventListener("touchend", resetJoystick, { passive: true });
    leftMoveZone.addEventListener("touchcancel", resetJoystick, { passive: true });

    let lookActive = false, lookTouchId = null, lookLastX = 0, lookLastY = 0;

    rightLookZone.addEventListener("touchstart", (e) => {
      if (lookActive) return;
      const t = e.changedTouches[0];
      lookTouchId = t.identifier;
      lookActive = true;
      lookLastX = t.clientX;
      lookLastY = t.clientY;
    }, { passive: true });

    rightLookZone.addEventListener("touchmove", (e) => {
      if (!lookActive) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === lookTouchId) {
          const dx = t.clientX - lookLastX;
          const dy = t.clientY - lookLastY;
          lookLastX = t.clientX;
          lookLastY = t.clientY;

          yaw -= dx * 0.005;
          pitch -= dy * 0.005;
          pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
          break;
        }
      }
    }, { passive: true });

    function stopLook(e) {
      if (!lookActive) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === lookTouchId) {
          lookActive = false;
          lookTouchId = null;
          break;
        }
      }
    }

    rightLookZone.addEventListener("touchend", stopLook, { passive: true });
    rightLookZone.addEventListener("touchcancel", stopLook, { passive: true });

    actionPrompt.addEventListener("click", toggleSeat);
  }

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    if (!isSeated) {
      const onStage = (
        camera.position.x >= stageBounds.minX && camera.position.x <= stageBounds.maxX &&
        camera.position.z >= stageBounds.minZ && camera.position.z <= stageBounds.maxZ
      );

      currentBaseY = onStage ? (stageHeight + defaultEyeHeight) : defaultEyeHeight;

      camera.position.y += velocityY;
      velocityY += gravity;

      if (camera.position.y <= currentBaseY) {
        camera.position.y = currentBaseY;
        velocityY = 0;
        isGrounded = true;
      }

      const speed = 0.16;
      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.sin(yaw + Math.PI / 2), 0, Math.cos(yaw + Math.PI / 2));

      let moveVector = new THREE.Vector3();

      if (moveF) moveVector.addScaledVector(forward, -speed);
      if (moveB) moveVector.addScaledVector(forward, speed);
      if (moveL) moveVector.addScaledVector(right, -speed);
      if (moveR) moveVector.addScaledVector(right, speed);

      if (isTouch && (joyDX !== 0 || joyDY !== 0)) {
        moveVector.addScaledVector(forward, joyDY * speed);
        moveVector.addScaledVector(right, joyDX * speed);
      }

      const nextX = camera.position.x + moveVector.x;
      const nextZ = camera.position.z + moveVector.z;

      nearestSeat = null;
      let minSeatDist = Infinity;

      for (let i = 0; i < seatPositions.length; i++) {
        const seat = seatPositions[i];
        const distToNext = Math.hypot(nextX - seat.x, nextZ - seat.z);

        if (distToNext < minSeatDist) {
          minSeatDist = distToNext;
          if (distToNext < 1.8) nearestSeat = seat;
        }
      }

      camera.position.x = Math.max(-48, Math.min(48, nextX));
      camera.position.z = Math.max(-25, Math.min(45, nextZ));

      if (nearestSeat) {
        actionPrompt.style.display = "block";
        actionPrompt.innerText = isTouch ? "Oturmak için dokun" : "Oturmak için [E] tuşuna bas";
      } else {
        actionPrompt.style.display = "none";
      }
    }

    renderer.render(scene, camera);
  }

  animate();
}

window.addEventListener("DOMContentLoaded", () => {
  // 3D dünya artık oyuncu girişi başarılı olduktan sonra başlar (playerLogin/playerRegister).
});
</script>

<script>
// --- ADMIN GİRİŞ / DUYURU PANELİ ---
const ADMIN_API = "https://psych-admin-server.onrender.com";
const REAL_ADMIN_PASSWORD = "121624"; // Sunucudaki gerçek admin şifresi (arka planda kullanılır)
const ADMIN_UI_USER = "baki";
const ADMIN_UI_PASS = "okul";

const adminOverlay = document.getElementById("adminOverlay");
const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const loginErr = document.getElementById("loginErr");
const adminMsgStatus = document.getElementById("adminMsgStatus");
const announceBanner = document.getElementById("announceBanner");

// --- OYUNCU GİRİŞ / KAYIT ---
const playerLoginOverlay = document.getElementById("playerLoginOverlay");
const playerLoginStatus = document.getElementById("playerLoginStatus");

function enterWorld() {
  playerLoginOverlay.classList.add("hidden");
  playerLoginOverlay.style.display = "none";
  try {
    if (typeof startWorld === "function") startWorld();
  } catch (err) {
    alert("3D dünya başlatılırken hata oluştu:\n" + err.message);
    console.error(err);
  }
}

async function playerLogin() {
  const username = document.getElementById("playerUser").value.trim();
  const password = document.getElementById("playerPass").value;
  if (!username || !password) {
    playerLoginStatus.innerText = "❌ Kullanıcı adı ve şifre gerekli.";
    return;
  }
  playerLoginStatus.style.color = "#8fd";
  playerLoginStatus.innerText = "⏳ Giriş yapılıyor...";
  try {
    const res = await fetch(ADMIN_API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      enterWorld();
    } else {
      playerLoginStatus.style.color = "#f88";
      playerLoginStatus.innerText = "❌ " + (data.error || "Giriş başarısız.");
    }
  } catch (err) {
    playerLoginStatus.style.color = "#f88";
    playerLoginStatus.innerText = "❌ Ağ hatası: " + err.message;
  }
}

async function playerRegister() {
  const username = document.getElementById("playerUser").value.trim();
  const password = document.getElementById("playerPass").value;
  if (!username || !password) {
    playerLoginStatus.innerText = "❌ Kullanıcı adı ve şifre gerekli.";
    return;
  }
  if (username.includes(" ")) {
    playerLoginStatus.innerText = "❌ Kullanıcı adında boşluk olamaz.";

  playerLoginStatus.innerText = "⏳ Kayıt olunuyor...";

      method: "POST",
      headers: { "Content-Type": "application/json" },

    });

      playerLoginStatus.style.color = "#f88";

document.getElementById("adminBtn").addEventListener("click", () => {
  adminOverlay.classList.add("show");
  loginPanel.classList.remove("hidden");
  adminPanel.classList.add("hidden");
  loginErr.innerText = "";
  document.getElementById("adminUser").value = "";
  document.getElementById("adminPass").value = "";
});

function closeAdminOverlay() {
  adminOverlay.classList.remove("show");
}

function adminTryLogin() {
  const u = document.getElementById("adminUser").value.trim();
  const p = document.getElementById("adminPass").value;
  if (u === ADMIN_UI_USER && p === ADMIN_UI_PASS) {
    loginPanel.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    adminMsgStatus.innerText = "";
  } else {
    loginErr.innerText = "❌ Kullanıcı adı veya şifre yanlış";
  }
}

async function readAdminError(res) {
  let detail = "";
  try {
    const text = await res.text();
    try {
      const j = JSON.parse(text);
      detail = j.error || j.message || text;
    } catch (_) {
      detail = text;
    }
  } catch (_) {}
  return `HTTP ${res.status}${detail ? " — " + detail : ""}`;
}

async function adminSendAnnouncement() {
  const message = document.getElementById("adminMsgInput").value;
  if (!message.trim()) {
    adminMsgStatus.style.color = "#f88";
    adminMsgStatus.innerText = "❌ Duyuru mesajı boş olamaz.";
    return;
  }
  adminMsgStatus.style.color = "#8fd";
  adminMsgStatus.innerText = "⏳ Gönderiliyor...";
  try {
    const res = await fetch(ADMIN_API + "/announcement", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, password: REAL_ADMIN_PASSWORD })
    });
    if (res.ok) {
      adminMsgStatus.style.color = "#8fd";
      adminMsgStatus.innerText = "✅ Duyuru gönderildi.";
      document.getElementById("adminMsgInput").value = "";
      checkAnnouncement();
    } else {
      adminMsgStatus.style.color = "#f88";
      adminMsgStatus.innerText = "❌ " + (await readAdminError(res));
    }
  } catch (err) {
    adminMsgStatus.style.color = "#f88";
    adminMsgStatus.innerText = "❌ Ağ hatası: " + err.message;
  }
}

// Tüm ziyaretçilere duyuruyu gösterme
let lastShownAnnouncement = "";
async function checkAnnouncement() {
  try {
    const res = await fetch(ADMIN_API + "/announcement");
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.message && data.message !== lastShownAnnouncement) {
      lastShownAnnouncement = data.message;
      announceBanner.innerText = data.message;
      announceBanner.classList.add("show");
      setTimeout(() => announceBanner.classList.remove("show"), 6000);
    }
  } catch (_) {}
}

checkAnnouncement();
setInterval(checkAnnouncement, 20000);

// --- ŞARKI ÇALMA ---
const bgAudio = document.getElementById("bgAudio");
let lastSongStartedAt = null;

async function checkSong() {
  try {
    const res = await fetch(ADMIN_API + "/song");
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.song && data.startedAt !== lastSongStartedAt) {
      lastSongStartedAt = data.startedAt;
      bgAudio.src = ADMIN_API + "/songs/" + data.song;
      bgAudio.currentTime = 0;
      bgAudio.play().catch(() => {
        // Tarayıcı otomatik oynatmayı engellemiş olabilir, sayfaya bir dokunuş bunu çözer.
        document.addEventListener("click", () => bgAudio.play().catch(() => {}), { once: true });
        document.addEventListener("touchstart", () => bgAudio.play().catch(() => {}), { once: true });
      });
    }
  } catch (_) {}
}

checkSong();
setInterval(checkSong, 5000);
